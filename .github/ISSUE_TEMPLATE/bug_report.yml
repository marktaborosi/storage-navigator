name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems go through SECURITY.md, not public issues.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The Options you use and the request or clicks that show the problem.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: storage-navigator 3.0.0, PHP 8.4, league/flysystem-aws-s3-v3 3.29
    validations:
      required: true
